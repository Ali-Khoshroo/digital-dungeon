{{ define "main" }}
<section class="posts-section" id="tag-posts">
  <div class="section-heading">
    <div>
      <p class="eyebrow">TAGGED</p>
      <h2>{{ .Title }}</h2>
    </div>
    <a class="text-link" href="{{ "tags/" | relURL }}">&larr; all tags</a>
  </div>

  <div class="post-list">
    {{ range .Pages.ByDate.Reverse }}
    {{ partial "post-card.html" . }}
    {{ end }}
  </div>
</section>
{{ end }}
